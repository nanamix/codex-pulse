[workspace]
members = ["crates/usage-core", "crates/usage-cli", "src-tauri", "crates/test-server"]
default-members = ["crates/usage-core", "crates/usage-cli"]
resolver = "2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "rt-multi-thread", "macros", "signal"] }
